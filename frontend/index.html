<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Drydock — self-hosted server control panel (control plane) for managing Linux servers, Nginx, Docker, systemd, TLS certificates and files over SSH. Agentless, with dry-run, diff, snapshot and automatic rollback."
    />
    <meta
      name="keywords"
      content="drydock, server management, control panel, self-hosted, SSH, Linux, Nginx, nginx management, docker, docker compose, systemd, TLS, SSL, certificate renewal, certbot, deploy, devops, sysadmin, infrastructure, golang, react, dashboard, web terminal, audit log, self-hosted control plane, fleet management, server dashboard"
    />
    <meta name="author" content="Aziz ARSLAN" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Drydock — self-hosted SSH server control plane" />
    <meta
      property="og:description"
      content="Manage Linux servers, Nginx, Docker, systemd and TLS certificates from one agentless web panel — with preview, snapshot and rollback on every change."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Drydock — Self-hosted SSH Server Control Plane</title>
    <script>
      // Apply the persisted (or system) theme before paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('drydock.theme')
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
