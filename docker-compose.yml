services:
  drydock:
    build:
      context: .
      dockerfile: Dockerfile
    image: drydock:latest
    container_name: drydock
    restart: unless-stopped
    # Bound to loopback on purpose: terminate TLS with a reverse proxy and
    # never expose the control plane directly to the internet.
    ports:
      - "127.0.0.1:8788:8788"
    env_file:
      - path: .env
        required: false
    environment:
      DRYDOCK_ADDR: 0.0.0.0:8788
      DRYDOCK_DATA_DIR: /data
      DRYDOCK_DB: /data/drydock.db
      DRYDOCK_WEB_DIR: /app/web
    volumes:
      - drydock-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/api/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  drydock-data:
